<aside class="site-music-player is-collapsed" id="siteMusicPlayer" aria-label="官網背景音樂播放器" hidden>
  <audio id="siteMusicAudio" preload="none" loop></audio>
  <button class="site-music-toggle" id="siteMusicToggle" type="button" aria-label="播放背景音樂" aria-pressed="false"><span id="siteMusicIcon" aria-hidden="true">▶</span></button>
  <div class="site-music-copy">
    <small id="siteMusicEyebrow">CAFE MUSIC</small>
    <strong id="siteMusicTitle">曇時店歌</strong>
    <span id="siteMusicState" aria-live="polite">點擊播放</span>
  </div>
  <input class="site-music-volume" id="siteMusicVisitorVolume" type="range" min="0" max="100" value="30" aria-label="背景音樂音量">
  <button class="site-music-collapse" id="siteMusicCollapse" type="button" aria-label="收合音樂播放器">−</button>
</aside>
